services:
  NN:
    image: youme-we/projectgan_ui_nn:latest
    volumes:
      - ./NN:/app
    env_file: ".host.env"
    stdin_open: true
    tty: true

  server:
    image: youme-we/projectgan_ui_server:latest
    ports:
      - "3001:3001"
    volumes:
      - ./UI/server:/app
    env_file: ".host.env"

  client:
    image: youme-we/projectgan_ui_client:latest
    ports:
      - "3000:3000"
    volumes:
      - ./UI/client:/app
      #- /app/node_modules
    env_file: ".host.env"

  mongodb:
    image: mongodb/mongodb-community-server:6.0-ubi8
    environment:
      - MONGO_INITDB_ROOT_USERNAME=user
      - MONGO_INITDB_ROOT_PASSWORD=pass
    volumes:
      - type: bind
        source: ./data
        target: /data/db
