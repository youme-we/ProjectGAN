services:
  server:
    image: youme-we/projectgan_server:latest
    ports:
      - "3001:3001"
    volumes:
      - ./UI/server:/app
    env_file: ".host.env"
    healthcheck:
      test: ["CMD", "curl", "http://localhost:3001/healthcheck"]
      interval: 1s
      timeout: 5s
      retries: 2
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongodb/mongodb-community-server:latest
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=pass
    volumes:
      - type: bind
        source: ./data
        target: /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ping: 1})"]
      interval: 10s
      timeout: 5s
      retries: 2
